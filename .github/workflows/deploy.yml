name: CI and deploy

# Tests run on every push and every pull request. A deploy only ever happens
# from a push to main that is already green, so the live demo link cannot be
# broken by a failing commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run can be lost to a runner fault rather than anything in the tree -
  # startup_failure, or a job cancelled before a single step executes. Without
  # a manual trigger the only way to recover is an empty commit, which puts
  # noise in the history to work around someone else's outage.
  workflow_dispatch:

# Sessions are process-local and the service runs at --max-instances 1, so two
# deploys must never overlap on the same service. Queue them instead, and do
# not cancel one that is already mid-flight.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE: pf-sahi-hai
  REGION: asia-south1

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Every suite runs even if an earlier one fails, so a red build reports
      # everything that is broken rather than only the first thing.
      - name: Run all suites
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "::group::$f"
            if python "$f"; then
              echo "$f OK"
            else
              echo "::error file=$f::suite failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # Several modules carry their own self-test and are not under tests/.
      # Listing them explicitly rather than globbing keeps a module that loses
      # its self-test from silently dropping out of CI.
      - name: Module self-tests
        run: |
          fail=0
          for f in app/cssmin.py app/demo.py app/models.py app/solver.py                    core/entity.py core/epfo_rules.py core/orphan.py                    core/parsers.py core/reconcile.py; do
            echo "::group::$f"
            if python "$f"; then
              echo "$f OK"
            else
              echo "::error file=$f::self-test failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  deploy:
    name: deploy to Cloud Run
    needs: test
    # Pull requests stop at the test job. A fork PR never reaches this job and
    # so never sees credentials, which is the whole reason deploy is gated on
    # the event type rather than on the branch alone.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required to mint the OIDC token that WIF exchanges
    steps:
      - uses: actions/checkout@v5

      # Workload Identity Federation: GitHub's OIDC token is exchanged for a
      # short-lived GCP credential. No service-account key exists anywhere.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # Recorded before the deploy so a bad revision can be rolled back to a
      # revision known to have served traffic.
      - name: Record current serving revision
        id: current
        run: |
          rev=$(gcloud run services describe "$SERVICE" \
                  --region "$REGION" --project "${{ secrets.GCP_PROJECT }}" \
                  --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "currently serving: ${rev:-none}"

      # deploy-cloudrun.sh is the single definition of the deploy flags, so a
      # local deploy and a CI deploy cannot drift apart.
      - name: Deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          chmod +x deploy-cloudrun.sh
          ./deploy-cloudrun.sh

      # The script warns on an unhealthy /status but still exits 0. CI has to
      # treat that as a failure, because the demo link is the deliverable.
      - name: Verify /status
        id: verify
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
                  --region "$REGION" --project "${{ secrets.GCP_PROJECT }}" \
                  --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' "$URL/status" || true)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/health)"
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 3
          done
          echo "::error::/status returned $code after 10 attempts"
          exit 1

      - name: Roll back on failed verification
        if: failure() && steps.verify.outcome == 'failure' && steps.current.outputs.revision != ''
        run: |
          echo "::warning::rolling back to ${{ steps.current.outputs.revision }}"
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" --project "${{ secrets.GCP_PROJECT }}" \
            --to-revisions "${{ steps.current.outputs.revision }}=100"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- **URL:** ${{ steps.verify.outputs.url }}"
            echo "- **Status:** \`${{ steps.verify.outputs.url }}/status\`"
            echo "- **Commit:** \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
